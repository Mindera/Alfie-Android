name: PR Validation and Firebase Deployment

on:
  pull_request:
    branches:
      - main

jobs:
  setup_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin the JDK instead of using the runner default: ubuntu-latest moved to an image whose
      # default JDK is 25, which detekt 1.23 rejects (--jvm-target accepts up to 22). 21 matches
      # the JDK the dependency-submission workflow builds with.
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Install Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Set Firebase Credentials
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_DISTRIBUTOR_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "FIREBASE_APP_ID=${FIREBASE_APP_ID}" >> $GITHUB_ENV
          echo "${FIREBASE_CREDENTIALS}" > fastlane/firebase_login_credentials.json
          echo "${GOOGLE_SERVICES_JSON}" > app/src/google-services.json

      - name: Run Fastlane
        run: bundle exec fastlane deploy_debug
