# Weekly dependency update PRs.
#
# Every version in this project lives in gradle/libs.versions.toml, which
# Dependabot reads natively, so the catalog is the only manifest it needs. It
# also runs Gradle to bump the wrapper (gradle-wrapper.properties, gradlew,
# gradlew.bat, gradle-wrapper.jar).
#
# Release notes, changelogs and commit lists are added to the PR body by
# Dependabot itself — there is no option to switch that on. It resolves them
# from each dependency's pom.xml, so a dependency that omits its SCM metadata
# gets a PR without those sections. Breaking changes are surfaced separately by
# .github/workflows/dependabot-triage.yml, which labels major bumps.
version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 10
    assignees:
      - hoangnhatdrk
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor and patch bumps travel together as one PR to review. Major bumps
      # are deliberately left ungrouped so each one arrives on its own, with its
      # own release notes and the breaking-change label.
      gradle-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

    ignore:
      # CameraX is held at the 1.5.x line by compileSdk 35 (buildconvention AppConfig.kt).
      # camera-* 1.6.x refuses to build with "requires libraries and applications that depend on
      # it to compile against version 36 or later of the Android APIs" — verified against 1.6.2.
      # Raise compileSdk to 36 first, then drop this entry. Patch bumps within 1.5.x still come
      # through, since those are the ones that cannot hit the ceiling.
      - dependency-name: "androidx.camera:*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

      # Not a build blocker — barcode-scanning is already at the newest version (17.3.0). It is
      # held back because it ships a bundled native model, and the decode path is the one part of
      # the scanner that neither CI nor an emulator can exercise: it needs a real camera pointed
      # at a real barcode. So model-changing bumps should be taken deliberately and smoke-tested
      # on a device, not auto-merged. Patch bumps still come through and warrant that same check.
      - dependency-name: "com.google.mlkit:barcode-scanning"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    assignees:
      - hoangnhatdrk
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
