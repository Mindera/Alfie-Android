query GetProductDetails($handle: String!) {
    productDetails(handle: $handle) {
        ...ProductFragment
    }
}

query ProductByBarcode($barcode: String!) {
    productByBarcode(barcode: $barcode) {
        id
        name
        slug
        variantId
    }
}

query GetRelatedProducts($handle: String!, $limit: Int!) {
    relatedProducts(handle: $handle, limit: $limit) {
        ...ProductListEntryFragment
    }
}
